name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./syncboard-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: './syncboard-client/package-lock.json'
      - run: npm ci
      - run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: syncboard-client/coverage/
          if-no-files-found: ignore

  server:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ./syncboard-server
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: '22'
              cache: npm
              cache-dependency-path: './syncboard-server/package-lock.json'
          - run: npm ci
          
          - run: npm test
            env:
              JWT_SECRET: supersecret_github_test_key